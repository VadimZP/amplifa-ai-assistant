# Sender fixtures for testing

# Active sender for Acme with full profile
acme_john:
  organization: acme
  first_name: John
  last_name: Smith
  nickname: Johnny
  email: john@acme.com
  job_title: Account Executive
  linkedin_url: https://linkedin.com/in/johnsmith
  calendly_url: https://calendly.com/john-smith
  signature_template: |
    <p>Best regards,<br>
    <strong>{{sender_full_name}}</strong><br>
    {{sender_job_title}}<br>
    {{sender_company}}</p>
    <p><a href="{{sender_calendly_url}}">Schedule a call</a></p>
  status: active
  timezone: Europe/Berlin
  send_window_start_hour: 8
  send_window_end_hour: 18
  send_window_start_minute: 0
  send_window_end_minute: 0
  created_at: <%= Time.zone.now %>
  updated_at: <%= Time.zone.now %>

