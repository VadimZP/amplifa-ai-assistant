# Sender with Calendly OAuth connected (for testing webhook processing)
# Note: encrypted fields (tokens, signing_key) should be set in test setup code
# since fixtures don't support Rails encryption
calendly_connected:
  organization: acme
  first_name: Sam
  last_name: Connected
  email: sam@acme.com
  job_title: Sales Rep
  calendly_url: https://calendly.com/sam-connected
  status: active
  calendly_token_expires_at: <%= 1.hour.from_now %>
  calendly_user_uri: https://api.calendly.com/users/test-user-123
  calendly_organization_uri: https://api.calendly.com/organizations/test-org-123
  calendly_webhook_uri: https://api.calendly.com/webhook_subscriptions/test-webhook-123
  calendly_connected_at: <%= 1.day.ago %>
  calendly_connection_status: connected
  created_at: <%= Time.zone.now %>
  updated_at: <%= Time.zone.now %>
