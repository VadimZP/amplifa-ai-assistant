# Dana has two active memberships. The acme membership is created earlier so
# it wins switchable_organization_memberships.order(:created_at).first, making
# acme the consented/primary org bound to her MCP token.
dana_primary_acme:
  account: dana
  organization: acme
  role: customer_user
  status: active
  created_at: <%= 3.days.ago %>
  updated_at: <%= 3.days.ago %>

dana_secondary_growth_lab:
  account: dana
  organization: growth_lab
  role: customer_user
  status: active
  created_at: <%= 1.day.ago %>
  updated_at: <%= 1.day.ago %>
