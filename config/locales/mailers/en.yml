# English email translations for Amplifa
# Week 2 MVP - Internationalization

en:
  mailers:
    invitation:
      subject: "You're invited to join %{organization} on Amplifa"
      greeting: "Hi %{name},"
      intro: "%{admin_name} has invited you to join %{organization} on Amplifa, the AI-powered outbound automation platform."
      description: "Click the button below to accept your invitation and set up your account. You'll be able to start generating qualified leads for your business."
      cta: "Accept Invitation"
      expiry: "This invitation expires on %{date}."
      help: "If you have any questions, please contact your administrator."

    playbook:
      generated:
        subject: "Playbook generated for %{product} (%{organization})"
        greeting: "Playbook generation completed"
        body: "A new playbook has been generated for %{product} at %{organization}. The AI analyzed the website and created %{persona_count} personae and %{use_case_count} use cases. Generated by %{initiated_by}."
        cta: "Review Playbook"

      generation_failed:
        subject: "Playbook generation failed for %{product} (%{organization})"
        greeting: "Playbook generation failed"
        body: "The AI generation for %{product} at %{organization} failed while analyzing %{website}."
        error_label: "Error"
        next_steps: "Please check the website URL and try again. If the problem persists, contact support."

      changes_requested:
        subject: "Changes requested for %{product} playbook (%{organization})"
        greeting: "Changes requested"
        body: "%{requester} from %{organization} has requested changes to the %{product} playbook. Their feedback is below:"
        cta: "Review & Make Changes"

      approved:
        subject: "%{product} playbook approved by %{organization}"
        greeting: "Playbook approved!"
        body: "%{approver} from %{organization} has approved the %{product} playbook. The playbook is now ready to use for campaign planning."
        cta: "View Playbook"

      moved_to_draft:
        subject: "%{product} playbook updated and ready for review"
        greeting: "Playbook ready for review"
        body: "The Amplifa team has updated your %{product} playbook based on your feedback. Please review the changes."
        cta: "Review Playbook"

      ready_for_review:
        subject: "New playbook ready for review: %{product}"
        greeting: "New playbook ready"
        body: "Your Amplifa team has created a playbook for %{product}. Please review and approve it."
        cta: "Review & Approve"

      archived:
        subject: "%{product} playbook archived"
        greeting: "Playbook archived"
        body: "The %{product} playbook has been archived by %{archiver}."
        cta: "View Playbook"

      new_comment:
        subject: "New comment on %{product} playbook"
        greeting: "New comment added"
        body: "%{commenter} added a comment to the %{product} playbook."
        cta: "View Comment"

    admin_notification:
      customer_lead_import_completed:
        subject: "Customer lead import completed for %{organization_name} (%{importer_name})"
      customer_lead_import_failed:
        subject: "Customer lead import failed for %{organization_name} (%{importer_name})"
      lead_list_file_uploaded:
        subject: "Lead list file uploaded by %{uploader_name} (%{organization_name})"
      buying_signals_completion_rate_alert:
        subject: "Buying signals completion rate %{completion_rate_percent}% below %{threshold_percent}% over %{window_minutes}m"

    password_reset:
      subject: "Reset your Amplifa password"
      greeting: "Reset your password"
      intro: "We received a request to reset the password for your account."
      instructions: "Click the button below to set a new password."
      cta: "Reset Password"
      ignore: "If you did not request this, you can safely ignore this email."

    verify_account:
      subject: "Activate your Amplifa account"
      preheader: "Finish setting up your Amplifa account."
      greeting: "Welcome to Amplifa"
      intro: "Your account has been created. Please activate it to finish setup and start using Amplifa."
      cta: "Activate Account"
      ignore: "If you did not create this account, you can safely ignore this email."

    email_two_factor:
      subject: "Complete your Amplifa sign in"
      preheader: "Use this secure link to finish signing in to Amplifa."
      greeting: "Confirm your sign in"
      intro: "We received a sign-in request for your Amplifa account. Click the button below to complete sign in."
      cta: "Complete Sign In"
      ignore: "If you did not try to sign in, you can safely ignore this email."

    conversation_forward:
      lead_company: "Company"
    signature: "Best regards,<br>The Amplifa Team"
