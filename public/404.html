<!doctype html>
<html lang="en">
  <head>
    <title>Page not found - Amplifa</title>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="robots" content="noindex, nofollow">

    <style>
      *, *::before, *::after {
        box-sizing: border-box;
      }

      * {
        margin: 0;
      }

      :root {
        color-scheme: dark;
        --background: #0a0a0b;
        --panel: #111113;
        --panel-border: rgba(255, 255, 255, 0.1);
        --foreground: #f4f4f5;
        --muted: #a1a1aa;
        --primary: #20d487;
        --primary-hover: #18bd76;
      }

      body {
        min-height: 100vh;
        min-height: 100dvh;
        background: var(--background);
        color: var(--foreground);
        font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        -webkit-font-smoothing: antialiased;
        text-rendering: optimizeLegibility;
      }

      .page {
        display: flex;
        min-height: 100vh;
        min-height: 100dvh;
        overflow: hidden;
      }

      .brand-panel {
        position: relative;
        display: none;
        width: 50%;
        overflow: hidden;
        background: linear-gradient(135deg, #0a0a0b 0%, #111113 52%, #0a0a0b 100%);
      }

      .brand-panel::before,
      .brand-panel::after {
        content: "";
        position: absolute;
        border-radius: 999px;
        filter: blur(110px);
        opacity: 0.45;
      }

      .brand-panel::before {
        top: 22%;
        left: 18%;
        width: 24rem;
        height: 24rem;
        background: color-mix(in srgb, var(--primary) 45%, transparent);
      }

      .brand-panel::after {
        right: 12%;
        bottom: 20%;
        width: 20rem;
        height: 20rem;
        background: rgba(59, 130, 246, 0.22);
      }

      .grid {
        position: absolute;
        inset: 0;
        background-image:
          linear-gradient(rgba(255, 255, 255, 0.025) 1px, transparent 1px),
          linear-gradient(90deg, rgba(255, 255, 255, 0.025) 1px, transparent 1px);
        background-size: 64px 64px;
      }

      .brand-content {
        position: relative;
        z-index: 1;
        display: flex;
        width: 100%;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        padding: 3rem;
        text-align: center;
      }

      .logo-mark {
        display: flex;
        height: 6rem;
        width: 6rem;
        align-items: center;
        justify-content: center;
        border-radius: 1.5rem;
        background: #ffffff;
        box-shadow: 0 24px 80px rgba(32, 212, 135, 0.2);
      }

      .logo-mark img {
        height: 3.5rem;
        width: 3.5rem;
      }

      .brand-copy {
        margin-top: 2rem;
        max-width: 28rem;
        color: var(--muted);
        font-size: 1.25rem;
        line-height: 1.65;
      }

      .content-panel {
        display: flex;
        width: 100%;
        align-items: center;
        justify-content: center;
        padding: 2rem;
      }

      .card {
        width: min(100%, 28rem);
      }

      .mobile-logo {
        display: flex;
        justify-content: center;
        margin-bottom: 2rem;
      }

      .mobile-logo span {
        display: flex;
        height: 4rem;
        width: 4rem;
        align-items: center;
        justify-content: center;
        border-radius: 1rem;
        background: #ffffff;
      }

      .mobile-logo img {
        height: 2.5rem;
        width: 2.5rem;
      }

      .eyebrow {
        color: var(--primary);
        font-size: 0.875rem;
        font-weight: 700;
        letter-spacing: 0.14em;
        text-transform: uppercase;
      }

      h1 {
        margin-top: 0.75rem;
        color: var(--foreground);
        font-size: clamp(2.25rem, 8vw, 4.5rem);
        line-height: 0.95;
        letter-spacing: -0.06em;
      }

      p {
        margin-top: 1rem;
        color: var(--muted);
        font-size: 1rem;
        line-height: 1.7;
      }

      .actions {
        display: flex;
        flex-direction: column;
        gap: 0.75rem;
        margin-top: 2rem;
      }

      a {
        display: inline-flex;
        min-height: 2.75rem;
        align-items: center;
        justify-content: center;
        border-radius: 0.5rem;
        padding: 0.75rem 1rem;
        color: inherit;
        font-size: 0.875rem;
        font-weight: 600;
        text-decoration: none;
        transition: transform 150ms ease, background 150ms ease, border-color 150ms ease;
      }

      a:hover {
        transform: translateY(-1px);
      }

      .primary {
        background: var(--primary);
        color: #04120b;
      }

      .primary:hover {
        background: var(--primary-hover);
      }

      .secondary {
        border: 1px solid var(--panel-border);
        background: rgba(255, 255, 255, 0.03);
        color: var(--foreground);
      }

      .secondary:hover {
        border-color: rgba(255, 255, 255, 0.18);
        background: rgba(255, 255, 255, 0.06);
      }

      @media (min-width: 1024px) {
        .brand-panel {
          display: flex;
        }

        .content-panel {
          width: 50%;
        }

        .mobile-logo {
          display: none;
        }
      }
    </style>
  </head>

  <body>
    <main class="page">
      <section class="brand-panel" aria-label="Amplifa">
        <div class="grid"></div>
        <div class="brand-content">
          <div class="logo-mark">
            <img src="/amplifa-logo-icon-dark.svg" alt="Amplifa">
          </div>
          <p class="brand-copy">AI-powered sales outreach platform</p>
        </div>
      </section>

      <section class="content-panel">
        <div class="card">
          <div class="mobile-logo">
            <span><img src="/amplifa-logo-icon-dark.svg" alt="Amplifa"></span>
          </div>
          <div class="eyebrow">404</div>
          <h1>Page not found</h1>
          <p>The page you are looking for may have moved, been deleted, or the address may be mistyped.</p>
          <div class="actions">
            <a class="primary" href="/login">Go to login</a>
            <a class="secondary" href="/">Back to homepage</a>
          </div>
        </div>
      </section>
    </main>
  </body>
</html>
